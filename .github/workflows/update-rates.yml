name: Refresh FX snapshot

on:
  schedule:
    - cron: "30 */3 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:

permissions:
  contents: write

concurrency: refresh-fx-snapshot

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch bank quotes and mid-market rates
        run: npm run update-rates

      - name: Commit updated snapshot
        run: |
          git add assets/rates.js assets/history
          if git diff --cached --quiet; then
            echo "No rate changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh FX snapshot"
          git push
